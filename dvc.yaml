stages:
  pull_boxscores:
    cmd: python -m src.ingest.pull_boxscores
    deps:
      - src/ingest/pull_boxscores.py
    params:
      - ingest.season
    outs:
      - data/raw/boxscores

  derive_transactions:
    cmd: python -m src.ingest.derive_transactions
    deps:
      - data/raw/boxscores
      - src/ingest/derive_transactions.py
    params:
      - ingest.season
    outs:
      - data/raw/transactions.csv

  build_rosters:
    cmd: python -m src.features.build_rosters
    deps:
      - data/raw/transactions.csv
      - src/features/build_rosters.py
    outs:
      - data/interim/rosters

  player_ratings:
    cmd: python -m src.features.player_ratings
    deps:
      - data/raw/boxscores
      - src/features/player_ratings.py
    params:
      - ingest.season
      - ratings
    outs:
      - data/processed/player_ratings.parquet
