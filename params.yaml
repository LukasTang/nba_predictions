mode: offseason          # offseason | inseason
season: "2026-27"        # the season we are modelling
ingest:
  # Latest completed season we can actually pull game logs for. Kept separate
  # from `season` because nba_api has no data for a not-yet-started season.
  season: "2024-25"
ratings:
  metric: box_gmsc       # transparent Game-Score-Proxy; BPM/EPM/RAPM sind dokumentierte spätere Swaps
  per_minutes: 36        # Normalisierung der Rate
  min_minutes: 200       # Schwelle für das `reliable`-Flag
minutes:
  source: depth_chart
transfer:
  context_light: [reb, ts_pct]
  context_heavy: [ast, plus_minus]
  regression_to_mean: 0.4
  uncertainty_inflation: 1.5
model:
  type: gradient_boosting
  target: win_prob       # offseason: win_total
promotion:
  metric: brier_score    # inseason; offseason: win_total_mae_vs_vegas
  min_improvement: 0.005
